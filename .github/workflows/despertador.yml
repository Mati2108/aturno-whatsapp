# Mantiene despierto el servicio desplegado.
#
# EL PROBLEMA
# Render en plan gratuito apaga el contenedor a los 15 minutos sin tráfico, y
# volver a levantarlo tarda entre 50 y 90 segundos. Twilio abandona el webhook
# a los ~15 segundos, así que el primer mensaje después de una pausa no se
# pierde "un poco": se pierde entero y la persona no recibe nada.
#
# Para alguien que prueba el bot una sola vez, eso es indistinguible de un bot
# roto.
#
# POR QUÉ ACÁ Y NO EN UN SERVICIO DE PING
# El repo ya está en GitHub y Actions es gratis en repos públicos. Un cron
# externo (cron-job.org y parecidos) hace lo mismo pero suma una cuenta más
# que mantener y que se puede perder.
#
# Ojo: GitHub desactiva los cron de un repo sin actividad por 60 días. Si el
# bot vuelve a dormirse dentro de unos meses, mirar acá primero.

name: Despertador

on:
  schedule:
    # Cada 10 minutos. GitHub no garantiza puntualidad en los cron —suele
    # atrasar unos minutos con carga alta—, por eso 10 y no 14: hay margen
    # antes de los 15 minutos que espera Render.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # para dispararlo a mano antes de una demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Los DOS servicios, no solo el bot.
      #
      # Con ATURNO_MODO=api el bot le pega al backend de aturno para todo:
      # servicios, horarios y la reserva. Los dos están en el plan gratuito, y
      # despertar el backend de aturno midió 26 segundos. El techo de
      # procesamiento del bot son 30. O sea que un bot despierto hablando con
      # un aturno dormido llega al límite en el primer mensaje, y el síntoma
      # sería "está tardando más de lo normal" sin ninguna causa visible.
      - name: Despertar los dos servicios
        run: |
          # --max-time 120: si el contenedor estaba dormido, ESTE pedido es el
          # que lo despierta y tarda. Ahí está el punto: que el lento sea este
          # y no el de una persona real.
          ping() {
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$2")
            echo "$1: $codigo"
            # No falla el job por un 5xx puntual: un despertador que manda
            # mails de error todas las noches se termina ignorando.
            case "$codigo" in
              200|404) ;;   # 404 del backend de aturno también prueba que está vivo
              *) echo "::warning::$1 respondió $codigo" ;;
            esac
          }
          ping bot     "${{ vars.URL_SERVICIO || 'https://aturno-whatsapp.onrender.com' }}/salud"
          ping aturno  "${{ vars.URL_ATURNO || 'https://aturno-backend.onrender.com' }}/api/public/business/_ping"
